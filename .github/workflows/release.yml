name: Release - App

on:
  push:
    tags:
      - "app-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3). Creates tag app-v<version> if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            version="${version#app-v}"
          else
            version="${GITHUB_REF_NAME#app-v}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-].+)?$ ]]; then
            echo "Invalid version '$version'. Expected SemVer like 1.2.3 (optional tag app-v1.2.3)."
            exit 1
          fi

          pubspec_version="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          if [ -n "$pubspec_version" ] && [ "$pubspec_version" != "$version" ]; then
            echo "::warning::Tag/version $version does not match pubspec.yaml version $pubspec_version"
          fi

          apk_name="PocketController-${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$version" >> "$GITHUB_OUTPUT"
          echo "apk=$apk_name" >> "$GITHUB_OUTPUT"
          echo "Releasing PocketController-App $version (tag app-v$version)"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found, skipping tests."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "artifacts/${{ steps.version.outputs.apk }}"

      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          apk='${{ steps.version.outputs.apk }}'
          notes_path="artifacts/release-notes-${version}.md"

          {
            echo "Android release build of PocketController-App ${version}."
            echo
            echo "- \`${apk}\`: release APK"
            echo
          } > "$notes_path"

          if [ -f CHANGELOG.md ]; then
            section="$(awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" {capture=1; next}
              capture && $0 ~ /^## \[/ {exit}
              capture {print}
            ' CHANGELOG.md | sed -e 's/[[:space:]]*$//' | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')"
            if [ -n "$section" ]; then
              printf '\n%s\n' "$section" >> "$notes_path"
            fi
          fi

          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "PocketController-App ${{ steps.version.outputs.version }}"
            git push origin "$tag"
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='${{ steps.version.outputs.tag }}'
          version='${{ steps.version.outputs.version }}'
          notes='${{ steps.notes.outputs.path }}'
          apk="artifacts/${{ steps.version.outputs.apk }}"

          for file in "$apk" "$notes"; do
            if [ ! -f "$file" ]; then
              echo "Missing release file: $file"
              exit 1
            fi
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
            gh release edit "$tag" --title "PocketController-App $version" --notes-file "$notes"
          else
            gh release create "$tag" "$apk" \
              --title "PocketController-App $version" \
              --notes-file "$notes" \
              --verify-tag
          fi
