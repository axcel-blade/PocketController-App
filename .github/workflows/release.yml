name: Release - App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3). Creates tag v<version> if missing."
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      apk: ${{ steps.version.outputs.apk }}
      ipa: ${{ steps.version.outputs.ipa }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            version="${version#v}"
            version="${version#app-v}"
          else
            version="${GITHUB_REF_NAME#v}"
            version="${version#app-v}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$version'. Expected numeric SemVer like 1.2.3 (tag v1.2.3)."
            exit 1
          fi

          pubspec_version="$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
          if [ -n "$pubspec_version" ] && [ "$pubspec_version" != "$version" ]; then
            echo "::warning::Tag/version $version does not match pubspec.yaml version $pubspec_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "apk=PocketController-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "ipa=PocketController-${version}.ipa" >> "$GITHUB_OUTPUT"
          echo "Releasing PocketController-App $version (tag v$version)"

  android:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [ -d "test" ]; then
            flutter test
          else
            echo "No test directory found, skipping tests."
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "artifacts/${{ needs.resolve.outputs.apk }}"

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: artifacts/${{ needs.resolve.outputs.apk }}
          if-no-files-found: error

  ios:
    needs: resolve
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          app_path="build/ios/iphoneos/Runner.app"
          if [ ! -d "$app_path" ]; then
            echo "Missing $app_path after iOS build"
            exit 1
          fi

          mkdir -p artifacts/Payload
          cp -R "$app_path" artifacts/Payload/Runner.app
          (
            cd artifacts
            zip -r "${{ needs.resolve.outputs.ipa }}" Payload
          )
          rm -rf artifacts/Payload

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: artifacts/${{ needs.resolve.outputs.ipa }}
          if-no-files-found: error

  publish:
    needs: [resolve, android, ios]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Download iOS IPA
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts

      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          version='${{ needs.resolve.outputs.version }}'
          apk='${{ needs.resolve.outputs.apk }}'
          ipa='${{ needs.resolve.outputs.ipa }}'
          notes_path="artifacts/release-notes-${version}.md"

          {
            echo "Mobile builds of PocketController-App ${version}."
            echo
            echo "- \`${apk}\`: Android release APK (sideloadable)"
            echo "- \`${ipa}\`: unsigned iOS IPA (requires your own signing / Apple Developer tooling to install on a device)"
            echo
          } > "$notes_path"

          if [ -f CHANGELOG.md ]; then
            section="$(awk -v ver="$version" '
              $0 ~ "^## \\[" ver "\\]" {capture=1; next}
              capture && $0 ~ /^## \[/ {exit}
              capture {print}
            ' CHANGELOG.md | sed -e 's/[[:space:]]*$//' | sed -e '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')"
            if [ -n "$section" ]; then
              printf '\n%s\n' "$section" >> "$notes_path"
            fi
          fi

          echo "path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          tag='${{ needs.resolve.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            git tag -a "$tag" -m "PocketController-App ${{ needs.resolve.outputs.version }}"
            git push origin "$tag"
          fi

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag='${{ needs.resolve.outputs.tag }}'
          version='${{ needs.resolve.outputs.version }}'
          notes='${{ steps.notes.outputs.path }}'
          apk="artifacts/${{ needs.resolve.outputs.apk }}"
          ipa="artifacts/${{ needs.resolve.outputs.ipa }}"

          for file in "$apk" "$ipa" "$notes"; do
            if [ ! -f "$file" ]; then
              echo "Missing release file: $file"
              exit 1
            fi
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$ipa" --clobber
            gh release edit "$tag" --title "PocketController-App $version" --notes-file "$notes"
          else
            gh release create "$tag" "$apk" "$ipa" \
              --title "PocketController-App $version" \
              --notes-file "$notes" \
              --verify-tag
          fi
