name: License Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify project license file
        shell: bash
        run: |
          license=""
          for candidate in LICENSE.md LICENSE LICENSE.txt; do
            if [ -f "$candidate" ]; then
              license="$candidate"
              break
            fi
          done
          if [ -z "$license" ]; then
            echo "::error::Missing LICENSE.md (or LICENSE) at repository root."
            exit 1
          fi
          if ! grep -qi 'MIT License' "$license"; then
            echo "::error::Expected an MIT license notice in $license."
            exit 1
          fi
          echo "Project license file looks like MIT ($license)."

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Summarize dependency licenses
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = Path("pubspec.lock")
          if not lock.exists():
              raise SystemExit("pubspec.lock missing")
          # pubspec.lock is YAML; keep a lightweight package inventory for the log.
          packages = []
          current = None
          for line in lock.read_text(encoding="utf-8").splitlines():
              if line.startswith("  ") and not line.startswith("    ") and line.strip().endswith(":"):
                  name = line.strip()[:-1]
                  if name not in ("sdks", "packages"):
                      current = name
              if current and line.strip().startswith("version:"):
                  version = line.split(":", 1)[1].strip().strip('"')
                  packages.append(f"{current} {version}")
                  current = None
          Path("dependency-packages.txt").write_text("\n".join(packages) + "\n", encoding="utf-8")
          print(f"Tracked {len(packages)} packages from pubspec.lock")
          for row in packages[:30]:
              print(row)
          if len(packages) > 30:
              print(f"... and {len(packages) - 30} more")
          PY

      - name: Upload dependency inventory
        uses: actions/upload-artifact@v4
        with:
          name: dependency-packages-${{ github.sha }}
          path: dependency-packages.txt
          retention-days: 14
