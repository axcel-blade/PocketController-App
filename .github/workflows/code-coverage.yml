name: Code Coverage

on:
  push:
    branches: [main, develop]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/code-coverage.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/code-coverage.yml"

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 14

      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage file produced."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          lines_found = lines_hit = 0
          for line in Path("coverage/lcov.info").read_text(encoding="utf-8", errors="ignore").splitlines():
              if line.startswith("LF:"):
                  lines_found += int(line[3:])
              elif line.startswith("LH:"):
                  lines_hit += int(line[3:])
          pct = (100.0 * lines_hit / lines_found) if lines_found else 0.0
          print(f"Line coverage: {lines_hit}/{lines_found} ({pct:.1f}%)")
          PY
